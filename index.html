<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Aset Rumah</title>
<meta name="description" content="Pencatat dan pengingat aset kendaraan & barang rumah">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22314F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aset Rumah">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1E4;
    --paper-card:#FFFDF8;
    --paper-dark:#EAE0CB;
    --ink:#2A241C;
    --navy:#22314F;
    --navy-2:#324569;
    --rust:#AE3A21;
    --rust-bg:#F6E1D8;
    --amber:#B4790F;
    --amber-bg:#F7E9CB;
    --green:#3E6B4C;
    --green-bg:#E1EBDF;
    --muted:#8C8370;
    --line:#D9CDAF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,36,28,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  /* HEADER */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px solid var(--navy);
    padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap;gap:14px;
  }
  .masthead h1{
    font-family:'Bitter',serif;font-weight:800;font-size:30px;margin:0;
    color:var(--navy);letter-spacing:-0.3px;
  }
  .masthead .sub{
    font-size:12.5px;color:var(--muted);margin-top:4px;
    font-family:'JetBrains Mono',monospace;letter-spacing:0.3px;
  }
  .btn-add{
    background:var(--navy);color:#fff;border:none;border-radius:3px;
    padding:11px 18px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s;
  }
  .btn-add:hover{background:var(--navy-2);}

  /* SUMMARY STRIP */
  .summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .sum-card{
    flex:1;min-width:140px;background:var(--paper-card);border:1px solid var(--line);
    border-radius:4px;padding:12px 16px;position:relative;overflow:hidden;
  }
  .sum-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
  .sum-card.lewat::before{background:var(--rust);}
  .sum-card.segera::before{background:var(--amber);}
  .sum-card.aman::before{background:var(--green);}
  .sum-card .num{font-family:'Bitter',serif;font-weight:800;font-size:26px;line-height:1;}
  .sum-card.lewat .num{color:var(--rust);}
  .sum-card.segera .num{color:var(--amber);}
  .sum-card.aman .num{color:var(--green);}
  .sum-card .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.6px;}

  /* TABS */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{
    padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;
  }
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;}
  .empty{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:13px;border:1px dashed var(--line);border-radius:6px;
  }

  /* ASSET CARD */
  .card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:5px;
    position:relative;padding:16px 16px 14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(42,36,28,0.04);
  }
  .card .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .card.lewat .stripe{background:var(--rust);}
  .card.segera .stripe{background:var(--amber);}
  .card.aman .stripe{background:var(--green);}
  .card.none .stripe{background:var(--line);}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-family:'Bitter',serif;font-weight:700;font-size:17px;color:var(--ink);margin:0;padding-left:6px;}
  .card-meta{font-size:11.5px;color:var(--muted);padding-left:6px;margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .kategori-tag{
    display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;
    background:var(--paper-dark);color:var(--navy);padding:2px 7px;border-radius:2px;margin-left:6px;
    font-family:'Inter',sans-serif;font-weight:600;
  }

  /* STAMP BADGE - signature element */
  .stamp{
    width:64px;height:64px;border-radius:50%;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-9deg);border:2px solid; position:relative;
    font-family:'JetBrains Mono',monospace;
  }
  .stamp::after{
    content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid;opacity:0.55;
  }
  .stamp .n{font-weight:700;font-size:15px;line-height:1;}
  .stamp .t{font-size:7px;text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}
  .stamp.lewat{border-color:var(--rust);color:var(--rust);}
  .stamp.lewat::after{border-color:var(--rust);}
  .stamp.segera{border-color:var(--amber);color:var(--amber);}
  .stamp.segera::after{border-color:var(--amber);}
  .stamp.aman{border-color:var(--green);color:var(--green);}
  .stamp.aman::after{border-color:var(--green);}
  .stamp.none{border-color:var(--muted);color:var(--muted);}
  .stamp.none::after{border-color:var(--muted);}

  .divider{border:none;border-top:1px dashed var(--line);margin:12px 0 10px;}

  .rem-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 6px;border-radius:3px;font-size:12.5px;
  }
  .rem-row:nth-child(odd){background:rgba(42,36,28,0.02);}
  .rem-label{font-weight:600;color:var(--ink);}
  .rem-date{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .rem-badge{
    font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:0.3px;
  }
  .rem-badge.lewat{background:var(--rust-bg);color:var(--rust);}
  .rem-badge.segera{background:var(--amber-bg);color:var(--amber);}
  .rem-badge.aman{background:var(--green-bg);color:var(--green);}
  .rem-actions{display:flex;gap:4px;}
  .icon-btn{
    background:none;border:none;cursor:pointer;color:var(--muted);padding:3px 5px;font-size:12px;
    border-radius:3px;transition:color .15s, background .15s;
  }
  .icon-btn:hover{color:var(--navy);background:var(--paper-dark);}
  .icon-btn.danger:hover{color:var(--rust);}

  .no-rem{font-size:12px;color:var(--muted);font-style:italic;padding:4px 6px;}

  .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-left:2px;}
  .link-btn{
    background:none;border:none;color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;
    padding:4px 2px;text-decoration:underline;text-underline-offset:2px;
  }
  .card-icons{display:flex;gap:2px;}

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(34,49,79,0.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-card);border-radius:6px;max-width:440px;width:100%;
    max-height:88vh;overflow-y:auto;padding:22px 22px 20px;
    border:1px solid var(--line);
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
  }
  .modal h2{font-family:'Bitter',serif;font-size:19px;margin:0 0 14px;color:var(--navy);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:'Inter',sans-serif;font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .btn-secondary{
    background:none;border:1px solid var(--line);color:var(--ink);padding:9px 16px;
    border-radius:3px;font-weight:600;font-size:13px;cursor:pointer;
  }
  .btn-primary{
    background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:3px;
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .btn-primary:hover{background:var(--navy-2);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;
    font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:480px){
    .masthead h1{font-size:24px;}
    .stamp{width:54px;height:54px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Buku Aset Rumah</h1>
      <div class="sub" id="todayLabel">— memuat —</div>
    </div>
    <button class="btn-add" onclick="openAssetModal()">+ Tambah Aset</button>
  </div>

  <div class="summary" id="summary"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="assetOverlay">
  <div class="modal">
    <h2 id="assetModalTitle">Tambah Aset</h2>
    <input type="hidden" id="assetId">
    <div class="field">
      <label>Jenis</label>
      <select id="f-jenis">
        <option value="kendaraan">Kendaraan</option>
        <option value="barang">Barang Rumah</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Nama Aset</label>
        <input id="f-nama" placeholder="cth. Honda Vario 125">
      </div>
      <div class="field">
        <label>Kategori</label>
        <input id="f-kategori" placeholder="cth. Motor, AC, Kulkas">
      </div>
    </div>
    <div class="field">
      <label>Tanggal Perolehan</label>
      <input type="date" id="f-tanggalBeli">
    </div>
    <div class="field">
      <label>Catatan (opsional)</label>
      <textarea id="f-catatan" placeholder="No. polisi, no. seri, lokasi, dll"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('assetOverlay')">Batal</button>
      <button class="btn-primary" onclick="saveAsset()">Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="remOverlay">
  <div class="modal">
    <h2 id="remModalTitle">Tambah Pengingat</h2>
    <input type="hidden" id="remAssetId">
    <input type="hidden" id="remId">
    <div class="field">
      <label>Untuk apa pengingat ini?</label>
      <input id="r-label" placeholder="cth. Servis rutin, Pajak STNK, Garansi habis">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Jatuh Tempo</label>
        <input type="date" id="r-tanggal">
      </div>
      <div class="field">
        <label>Ulangi tiap (hari, opsional)</label>
        <input type="number" id="r-interval" placeholder="cth. 90">
      </div>
    </div>
    <div class="field">
      <label>Catatan (opsional)</label>
      <input id="r-catatan" placeholder="cth. bengkel resmi, no. invoice">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('remOverlay')">Batal</button>
      <button class="btn-primary" onclick="saveReminder()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let assets = [];
let filter = 'semua';
let expanded = {};
const STORAGE_KEY = 'aset-rumah:list-v1';

const todayStr = () => new Date().toISOString().slice(0,10);

function daysUntil(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d - today) / 86400000);
}
function statusOf(days){
  if(days < 0) return 'lewat';
  if(days <= 30) return 'segera';
  return 'aman';
}
function nearestReminder(asset){
  if(!asset.reminders || asset.reminders.length===0) return null;
  return [...asset.reminders].sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal))[0];
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function dayLabel(days){
  if(days < 0) return `Lewat ${Math.abs(days)} hr`;
  if(days === 0) return 'Hari ini';
  return `H-${days}`;
}

async function loadAssets(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    assets = res && res.value ? JSON.parse(res.value) : seedData();
  }catch(e){
    assets = seedData();
  }
  render();
}
async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(assets), false);
  }catch(e){
    console.error('Gagal menyimpan', e);
    showToast('Gagal menyimpan data');
  }
}
function seedData(){
  const t = new Date();
  const plus = (n)=>{ const d=new Date(t); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const minus = (n)=> plus(-n);
  return [
    {
      id: 'a1', jenis:'kendaraan', nama:'Honda Vario 125', kategori:'Motor',
      tanggalBeli:'2021-03-14', catatan:'No. Polisi B 3421 XYZ',
      reminders:[
        {id:'r1', label:'Servis rutin', tanggal: plus(4), interval:90, catatan:'Bengkel resmi AHASS'},
        {id:'r2', label:'Pajak STNK tahunan', tanggal: minus(3), interval:365, catatan:''}
      ]
    },
    {
      id:'a2', jenis:'barang', nama:'AC Daikin 1 PK', kategori:'AC',
      tanggalBeli:'2023-06-01', catatan:'Ruang tamu',
      reminders:[
        {id:'r3', label:'Cuci AC berkala', tanggal: plus(18), interval:120, catatan:''},
        {id:'r4', label:'Garansi kompresor habis', tanggal: plus(210), interval:null, catatan:''}
      ]
    },
    {
      id:'a3', jenis:'barang', nama:'Kulkas Sharp 2 Pintu', kategori:'Elektronik',
      tanggalBeli:'2022-11-20', catatan:'',
      reminders:[]
    }
  ];
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

function setFilter(j){ filter = j; render(); }
function toggleExpand(id){ expanded[id] = !expanded[id]; render(); }

function render(){
  document.getElementById('todayLabel').textContent = 'Hari ini · ' + fmtDate(todayStr());

  // tabs
  const tabs = document.getElementById('tabs');
  const opts = [['semua','Semua'],['kendaraan','Kendaraan'],['barang','Barang Rumah']];
  tabs.innerHTML = opts.map(([v,l])=>
    `<div class="tab ${filter===v?'active':''}" onclick="setFilter('${v}')">${l}</div>`
  ).join('');

  // summary
  let lewat=0, segera=0, aman=0;
  assets.forEach(a => (a.reminders||[]).forEach(r=>{
    const s = statusOf(daysUntil(r.tanggal));
    if(s==='lewat') lewat++; else if(s==='segera') segera++; else aman++;
  }));
  document.getElementById('summary').innerHTML = `
    <div class="sum-card lewat"><div class="num">${lewat}</div><div class="lbl">Lewat tempo</div></div>
    <div class="sum-card segera"><div class="num">${segera}</div><div class="lbl">Segera (≤30 hr)</div></div>
    <div class="sum-card aman"><div class="num">${aman}</div><div class="lbl">Aman</div></div>
  `;

  // grid
  let list = assets.filter(a => filter==='semua' || a.jenis===filter);
  list = [...list].sort((a,b)=>{
    const na = nearestReminder(a), nb = nearestReminder(b);
    const da = na ? daysUntil(na.tanggal) : Infinity;
    const db = nb ? daysUntil(nb.tanggal) : Infinity;
    return da - db;
  });

  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty">Belum ada aset di kategori ini.<br>Klik "+ Tambah Aset" untuk mulai mencatat.</div>`;
    return;
  }

  grid.innerHTML = list.map(asset => {
    const near = nearestReminder(asset);
    const status = near ? statusOf(daysUntil(near.tanggal)) : 'none';
    const isOpen = !!expanded[asset.id];
    const sortedRems = [...(asset.reminders||[])].sort((a,b)=> new Date(a.tanggal)-new Date(b.tanggal));

    const stampContent = near
      ? `<div class="n">${dayLabel(daysUntil(near.tanggal))}</div><div class="t">${status}</div>`
      : `<div class="n">—</div><div class="t">kosong</div>`;

    const remRows = sortedRems.length ? sortedRems.map(r=>{
      const d = daysUntil(r.tanggal);
      const s = statusOf(d);
      return `
        <div class="rem-row">
          <div>
            <div class="rem-label">${escapeHtml(r.label)}</div>
            <div class="rem-date">${fmtDate(r.tanggal)}${r.interval ? ' · ulang '+r.interval+' hr' : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="rem-badge ${s}">${dayLabel(d)}</span>
            <div class="rem-actions">
              <button class="icon-btn" title="Tandai selesai" onclick="completeReminder('${asset.id}','${r.id}')">✓</button>
              <button class="icon-btn" title="Ubah" onclick="openReminderModal('${asset.id}','${r.id}')">✎</button>
              <button class="icon-btn danger" title="Hapus" onclick="deleteReminder('${asset.id}','${r.id}')">✕</button>
            </div>
          </div>
        </div>`;
    }).join('') : `<div class="no-rem">Belum ada pengingat untuk aset ini.</div>`;

    return `
      <div class="card ${status}">
        <div class="stripe"></div>
        <div class="card-top">
          <div>
            <p class="card-title">${escapeHtml(asset.nama)}<span class="kategori-tag">${escapeHtml(asset.kategori||'-')}</span></p>
            <div class="card-meta">Sejak ${fmtDate(asset.tanggalBeli)} ${asset.catatan ? ' · '+escapeHtml(asset.catatan) : ''}</div>
          </div>
          <div class="stamp ${status}">${stampContent}</div>
        </div>
        ${isOpen ? `<hr class="divider">${remRows}` : ''}
        <div class="card-footer">
          <button class="link-btn" onclick="toggleExpand('${asset.id}')">${isOpen ? 'Sembunyikan' : 'Lihat pengingat ('+sortedRems.length+')'}</button>
          <div class="card-icons">
            <button class="icon-btn" title="Tambah pengingat" onclick="openReminderModal('${asset.id}')">+ Pengingat</button>
            <button class="icon-btn" title="Ubah aset" onclick="openAssetModal('${asset.id}')">✎</button>
            <button class="icon-btn danger" title="Hapus aset" onclick="deleteAsset('${asset.id}')">✕</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

/* ---- Asset modal ---- */
function openAssetModal(id){
  document.getElementById('assetId').value = id || '';
  if(id){
    const a = assets.find(x=>x.id===id);
    document.getElementById('assetModalTitle').textContent = 'Ubah Aset';
    document.getElementById('f-jenis').value = a.jenis;
    document.getElementById('f-nama').value = a.nama;
    document.getElementById('f-kategori').value = a.kategori || '';
    document.getElementById('f-tanggalBeli').value = a.tanggalBeli;
    document.getElementById('f-catatan').value = a.catatan || '';
  }else{
    document.getElementById('assetModalTitle').textContent = 'Tambah Aset';
    document.getElementById('f-jenis').value = 'kendaraan';
    document.getElementById('f-nama').value = '';
    document.getElementById('f-kategori').value = '';
    document.getElementById('f-tanggalBeli').value = todayStr();
    document.getElementById('f-catatan').value = '';
  }
  document.getElementById('assetOverlay').classList.add('show');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

async function saveAsset(){
  const id = document.getElementById('assetId').value;
  const nama = document.getElementById('f-nama').value.trim();
  if(!nama){ showToast('Nama aset wajib diisi'); return; }
  const data = {
    jenis: document.getElementById('f-jenis').value,
    nama,
    kategori: document.getElementById('f-kategori').value.trim(),
    tanggalBeli: document.getElementById('f-tanggalBeli').value || todayStr(),
    catatan: document.getElementById('f-catatan').value.trim(),
  };
  if(id){
    const a = assets.find(x=>x.id===id);
    Object.assign(a, data);
  }else{
    assets.push({id:'a'+Date.now(), reminders:[], ...data});
  }
  await persist();
  closeModal('assetOverlay');
  render();
  showToast('Aset disimpan');
}
async function deleteAsset(id){
  assets = assets.filter(a=>a.id!==id);
  await persist();
  render();
  showToast('Aset dihapus');
}

/* ---- Reminder modal ---- */
function openReminderModal(assetId, remId){
  document.getElementById('remAssetId').value = assetId;
  document.getElementById('remId').value = remId || '';
  if(remId){
    const a = assets.find(x=>x.id===assetId);
    const r = a.reminders.find(x=>x.id===remId);
    document.getElementById('remModalTitle').textContent = 'Ubah Pengingat';
    document.getElementById('r-label').value = r.label;
    document.getElementById('r-tanggal').value = r.tanggal;
    document.getElementById('r-interval').value = r.interval || '';
    document.getElementById('r-catatan').value = r.catatan || '';
  }else{
    document.getElementById('remModalTitle').textContent = 'Tambah Pengingat';
    document.getElementById('r-label').value = '';
    document.getElementById('r-tanggal').value = todayStr();
    document.getElementById('r-interval').value = '';
    document.getElementById('r-catatan').value = '';
  }
  document.getElementById('remOverlay').classList.add('show');
}
async function saveReminder(){
  const assetId = document.getElementById('remAssetId').value;
  const remId = document.getElementById('remId').value;
  const label = document.getElementById('r-label').value.trim();
  const tanggal = document.getElementById('r-tanggal').value;
  if(!label || !tanggal){ showToast('Isi keterangan dan tanggal jatuh tempo'); return; }
  const interval = document.getElementById('r-interval').value ? parseInt(document.getElementById('r-interval').value) : null;
  const catatan = document.getElementById('r-catatan').value.trim();
  const a = assets.find(x=>x.id===assetId);
  if(!a.reminders) a.reminders = [];
  if(remId){
    const r = a.reminders.find(x=>x.id===remId);
    Object.assign(r, {label, tanggal, interval, catatan});
  }else{
    a.reminders.push({id:'r'+Date.now(), label, tanggal, interval, catatan});
  }
  await persist();
  closeModal('remOverlay');
  expanded[assetId] = true;
  render();
  showToast('Pengingat disimpan');
}
async function deleteReminder(assetId, remId){
  const a = assets.find(x=>x.id===assetId);
  a.reminders = a.reminders.filter(r=>r.id!==remId);
  await persist();
  render();
  showToast('Pengingat dihapus');
}
async function completeReminder(assetId, remId){
  const a = assets.find(x=>x.id===assetId);
  const r = a.reminders.find(x=>x.id===remId);
  if(r.interval){
    const base = new Date(r.tanggal+'T00:00:00');
    base.setDate(base.getDate() + r.interval);
    r.tanggal = base.toISOString().slice(0,10);
    showToast('Ditandai selesai · pengingat berikutnya diatur ulang');
  }else{
    a.reminders = a.reminders.filter(x=>x.id!==remId);
    showToast('Ditandai selesai');
  }
  await persist();
  render();
}

loadAssets();

    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('Service worker gagal didaftarkan:', err);
    });
  });
}
